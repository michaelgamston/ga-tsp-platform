name: CI

on: 
    push:
        branches: [main]
    pull_request:

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: tsp_engine
        steps:
            - name: Check out code
              uses: actions/checkout@v4

            - name: Configure
              run: cmake -S . -B build

            - name: Build
              run: cmake --build build

            - name: Run tests
              run: ctest --test-dir build --output-on-failure
            

