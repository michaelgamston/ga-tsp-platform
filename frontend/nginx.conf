# One website, served on port 8080 (the unprivileged nginx image can't use port 80)
server {
    listen 8080;

    # Folder the page's files are served from
    root  /usr/share/nginx/html;
    index index.html;

    # Everything else: send the requested file, or 404 if it doesn't exist
    location / {
        try_files $uri $uri/ =404;
    }

    # API calls: forward to the FastAPI service.
    # The trailing "/" strips the /api/ prefix, so /api/jobs reaches FastAPI as /jobs.
    # "api" is the compose service name / Kubernetes Service name.
    location /api/ {
        proxy_pass http://api:8000/;
    }
}
