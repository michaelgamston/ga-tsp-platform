apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1                 # how many copies of the pod
  selector:
    matchLabels:
      app: redis              # "the pods I manage are the ones labelled app=redis"
  template:                   # the blueprint for each pod
    metadata:
      labels:
        app: redis            # every pod made from this blueprint gets this label
    spec:
      containers:
        - name: redis
          image: redis:7      # same image as in your compose file
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis 
spec:
  selector: 
    app: redis
  ports: 
    - port: 6379
      targetPort: 6379