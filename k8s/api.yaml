apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec: 
  replicas: 1
  selector: 
    matchLabels:
      app: api 
  template: 
    metadata:
      labels:
        app: api
    spec:
      containers: 
        - name: api
          image: tsp-api:dev
          ports: 
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: tsp-config
            - secretRef:
                name: tsp-db
---
apiVersion: v1
kind: Service
metadata:
  name: api 
spec:
  selector: 
    app: api
  ports:
    - port: 8000
      targetPort: 8000